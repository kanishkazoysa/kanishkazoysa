# Save at: .github/workflows/metrics.yml
#
# Generates stats cards as SVG files committed into your own repo, so they
# never depend on a third-party service being up. Requires one secret:
#
#   1. github.com/settings/tokens  -> "Generate new token (classic)"
#      Scopes: public_repo, read:user   (add "repo" if you want private stats)
#   2. Your repo -> Settings -> Secrets and variables -> Actions -> New secret
#      Name: METRICS_TOKEN     Value: <the token you just made>

name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ---------- Main overview card ----------
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kanishkazoysa
          filename: assets/metrics-overview.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Colombo
          config_display: large

      # ---------- Languages card ----------
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kanishkazoysa
          filename: assets/metrics-languages.svg
          template: classic
          base: ""
          config_timezone: Asia/Colombo
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: no

      # ---------- Isometric contribution calendar ----------
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kanishkazoysa
          filename: assets/metrics-calendar.svg
          template: classic
          base: ""
          config_timezone: Asia/Colombo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
