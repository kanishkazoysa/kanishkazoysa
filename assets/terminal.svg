<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" role="img" aria-label="Developer terminal animation">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2431"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="444" height="284" rx="12" fill="url(#term-bg)" stroke="#30363d" stroke-width="1.5"/>
  <path d="M8 20 a12 12 0 0 1 12 -12 h420 a12 12 0 0 1 12 12 v18 h-444 z" fill="url(#bar)"/>
  <line x1="8" y1="38" x2="452" y2="38" stroke="#30363d" stroke-width="1.5"/>

  <!-- traffic lights -->
  <circle cx="30" cy="23" r="5.5" fill="#ff5f56"/>
  <circle cx="50" cy="23" r="5.5" fill="#ffbd2e"/>
  <circle cx="70" cy="23" r="5.5" fill="#27c93f"/>

  <text x="230" y="28" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace"
        font-size="12" fill="#8b949e">kanishka@dev — zsh</text>

  <!-- terminal body -->
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5">

    <g opacity="0">
      <text x="26" y="70" fill="#27c93f">➜</text>
      <text x="46" y="70" fill="#58a6ff">~</text>
      <text x="62" y="70" fill="#c9d1d9">flutter build ios --release</text>
      <animate attributeName="opacity" values="0;1;1;1;1;1;1;0" keyTimes="0;0.08;0.2;0.4;0.6;0.8;0.95;1" dur="14s" repeatCount="indefinite"/>
    </g>

    <g opacity="0">
      <text x="26" y="98" fill="#8b949e">✓ Built build/ios/iphoneos/Runner.app</text>
      <animate attributeName="opacity" values="0;0;1;1;1;1;1;0" keyTimes="0;0.14;0.2;0.4;0.6;0.8;0.95;1" dur="14s" repeatCount="indefinite"/>
    </g>

    <g opacity="0">
      <text x="26" y="132" fill="#27c93f">➜</text>
      <text x="46" y="132" fill="#58a6ff">~</text>
      <text x="62" y="132" fill="#c9d1d9">uvicorn main:app --reload</text>
      <animate attributeName="opacity" values="0;0;0;1;1;1;1;0" keyTimes="0;0.14;0.26;0.34;0.6;0.8;0.95;1" dur="14s" repeatCount="indefinite"/>
    </g>

    <g opacity="0">
      <text x="26" y="160" fill="#8b949e">INFO  Uvicorn running on</text>
      <text x="222" y="160" fill="#ffbd2e">127.0.0.1:8000</text>
      <animate attributeName="opacity" values="0;0;0;0;1;1;1;0" keyTimes="0;0.14;0.26;0.4;0.48;0.8;0.95;1" dur="14s" repeatCount="indefinite"/>
    </g>

    <g opacity="0">
      <text x="26" y="194" fill="#27c93f">➜</text>
      <text x="46" y="194" fill="#58a6ff">~</text>
      <text x="62" y="194" fill="#c9d1d9">docker compose up -d</text>
      <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;0.14;0.26;0.4;0.55;0.64;0.95;1" dur="14s" repeatCount="indefinite"/>
    </g>

    <g opacity="0">
      <text x="26" y="222" fill="#8b949e">✓ 4 containers healthy</text>
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;0" keyTimes="0;0.14;0.26;0.4;0.55;0.72;0.8;1" dur="14s" repeatCount="indefinite"/>
    </g>

    <g opacity="0">
      <text x="26" y="256" fill="#27c93f">➜</text>
      <text x="46" y="256" fill="#58a6ff">~</text>
      <text x="62" y="256" fill="#c9d1d9">git push origin main</text>
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;0" keyTimes="0;0.14;0.26;0.4;0.55;0.78;0.86;1" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- blinking cursor -->
  <rect x="26" y="272" width="9" height="15" fill="#58a6ff">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
