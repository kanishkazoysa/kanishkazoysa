<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Kanishka Zoysa - Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="55%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#0e75b6"/>
      <stop offset="100%" stop-color="#2ea6c7"/>
      <animate attributeName="x1" values="0%;60%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;160%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#58a6ff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1000" height="230" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="230" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="230" rx="14" fill="url(#glow)"/>

  <!-- drifting orbs -->
  <g>
    <circle cx="120" cy="60" r="70" fill="#58a6ff" opacity="0.07">
      <animate attributeName="cy" values="60;90;60" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="180" r="95" fill="#2ea6c7" opacity="0.07">
      <animate attributeName="cy" values="180;145;180" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="45" r="45" fill="#0e75b6" opacity="0.08">
      <animate attributeName="cx" values="700;745;700" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- twinkling nodes -->
  <g fill="#58a6ff">
    <circle cx="215" cy="185" r="2.5"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="42" r="2"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="200" r="2.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="795" cy="70" r="2"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="30" r="2"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="150" r="2"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <text x="500" y="98" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="54" font-weight="700" fill="#ffffff" letter-spacing="3">
    KANISHKA ZOYSA
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" fill="freeze"/>
  </text>

  <!-- animated underline -->
  <rect x="330" y="118" width="340" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" from="0" to="340" dur="1.3s" begin="0.5s" fill="freeze"/>
    <animate attributeName="x" from="500" to="330" dur="1.3s" begin="0.5s" fill="freeze"/>
  </rect>

  <!-- role -->
  <text x="500" y="152" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="19" font-weight="500" fill="#c9d7e4" letter-spacing="4">
    SOFTWARE ENGINEER · FULL-STACK &amp; MOBILE
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.9s" fill="freeze"/>
  </text>

  <!-- stack line -->
  <text x="500" y="188" text-anchor="middle"
        font-family="'JetBrains Mono', Consolas, 'Courier New', monospace"
        font-size="14" fill="#58a6ff" letter-spacing="1.5">
    Flutter · React · FastAPI · Laravel · AWS
    <animate attributeName="opacity" from="0" to="0.95" dur="1s" begin="1.4s" fill="freeze"/>
  </text>

  <!-- corner brackets -->
  <g stroke="#58a6ff" stroke-width="2.5" fill="none" opacity="0.55">
    <path d="M34 62 L34 34 L62 34"/>
    <path d="M966 62 L966 34 L938 34"/>
    <path d="M34 168 L34 196 L62 196"/>
    <path d="M966 168 L966 196 L938 196"/>
    <animate attributeName="opacity" values="0.55;0.2;0.55" dur="4s" repeatCount="indefinite"/>
  </g>
</svg>
